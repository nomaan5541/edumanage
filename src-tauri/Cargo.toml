[package]
name = "edumanage"
version = "0.1.0"
description = "EduManage desktop shell (wraps the existing Vite/React app)"
authors = ["EduManage"]
edition = "2021"

[lib]
# `_lib` suffix avoids a Windows clash between the bin and lib names.
name = "edumanage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# See https://v2.tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
